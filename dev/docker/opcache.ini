; Development-only OPcache tuning for the moodle-docker web container.
;
; On Windows the bind-mounted Moodle tree costs tens of milliseconds per file
; access, and a Moodle request loads ~500 PHP files. With timestamp validation
; on, OPcache stats every file on every request and pages take 20-30 s. With it
; off, files are read once and requests are fast.
;
; Consequence: PHP changes are NOT picked up until OPcache is reset. After
; editing PHP run `dev/reload.sh` (a graceful Apache restart). PHPUnit and CLI
; scripts are unaffected (CLI does not use OPcache by default).
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
